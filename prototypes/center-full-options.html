<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITO 驾驶舱 · 中间列完整方案对比</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #020913; }
  body { font-family: var(--font-cn); color: var(--text); }

  .proto-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: radial-gradient(1100px 700px at 50% 42%, rgba(20, 92, 142, 0.18), transparent 70%), #020913;
  }
  .proto-stage-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .proto-stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    transform-origin: center center;
  }
  .proto-stage iframe {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    border: 0;
    pointer-events: none;
    background: #020913;
  }

  /* 整个中间列的精确位置：444 + 1032，102 + 930 */
  .proto-center {
    position: absolute;
    left: 444px;
    top: 102px;
    width: 1032px;
    height: 930px;
    z-index: 5;
  }

  .proto-view { height: 100%; display: grid; gap: 16px; }
  .proto-a-layout { grid-template-rows: 180px 390px 328px; }
  .proto-b-layout { grid-template-rows: 132px 450px 316px; }
  .proto-c-layout { grid-template-rows: 128px 500px 270px; }

  .proto-bottom { display: grid; gap: 16px; min-height: 0; }
  .proto-a-bottom { grid-template-columns: 1.35fr 1fr; }
  .proto-b-bottom { grid-template-columns: 1.28fr 1fr; }
  .proto-c-bottom { grid-template-columns: 1.08fr 1fr 1fr; }

  .proto-panel { height: 100%; animation: none; }
  .proto-panel .panel-head { flex: 0 0 44px; }
  .proto-panel .panel-body { min-height: 0; }

  /* ── 演示控制 ─────────────────────────────── */
  .demo-controls {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    white-space: nowrap;
  }
  .demo-mode {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 8.5px;
    color: var(--muted);
    letter-spacing: 0.03em;
  }
  .demo-mode i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 7px var(--green);
  }
  .demo-mode i.paused { background: var(--dim); box-shadow: none; }
  .demo-mode em {
    font-style: normal;
    color: var(--cyan);
    margin-left: 2px;
  }
  .demo-progress {
    width: 44px;
    height: 2px;
    background: rgba(53, 224, 255, 0.13);
    overflow: hidden;
  }
  .demo-progress i { display: block; width: 0; height: 100%; background: var(--cyan); transition: width 0.1s linear; }
  .demo-btn {
    height: 22px;
    min-width: 22px;
    padding: 0 5px;
    border: 1px solid rgba(53, 224, 255, 0.16);
    background: rgba(9, 43, 74, 0.32);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 8.5px;
    cursor: pointer;
    transition: 0.15s;
  }
  .demo-btn:hover { color: var(--cyan); border-color: rgba(53, 224, 255, 0.42); }
  .demo-states { display: flex; gap: 3px; margin-left: 2px; }
  .demo-state {
    height: 21px;
    padding: 0 6px;
    border: 1px solid rgba(53, 224, 255, 0.10);
    background: transparent;
    color: var(--dim);
    font-family: var(--font-cn);
    font-size: 8.5px;
    cursor: pointer;
    transition: 0.15s;
  }
  .demo-state i {
    display: inline-block;
    width: 4px;
    height: 4px;
    margin-right: 4px;
    border-radius: 50%;
    background: var(--green);
    vertical-align: 1px;
  }
  .demo-state[data-tone="crit"] i { background: var(--red); }
  .demo-state[data-tone="warn"] i { background: var(--yellow); }
  .demo-state:hover { color: var(--text-soft); border-color: rgba(53, 224, 255, 0.26); }
  .demo-state.active { color: var(--cyan-hi); border-color: rgba(53, 224, 255, 0.44); background: rgba(53, 224, 255, 0.10); }
  .demo-state.active[data-tone="crit"] { color: #ff9cac; border-color: rgba(255, 92, 114, 0.45); background: rgba(255, 92, 114, 0.10); }
  .demo-state.active[data-tone="warn"] { color: var(--yellow); border-color: rgba(255, 207, 63, 0.40); background: rgba(255, 207, 63, 0.08); }

  .head-tag { white-space: nowrap; }

  /* ── 通用状态与数字 ───────────────────────── */
  .s-ok { --sc: var(--green); }
  .s-warn { --sc: var(--yellow); }
  .s-crit { --sc: var(--red); }
  .s-cyan { --sc: var(--cyan); }

  .tiny-label {
    font-family: var(--font-mono);
    font-size: 6.5px;
    letter-spacing: 0.12em;
    color: var(--dim);
  }

  /* ── A · 核心业务运行态 ───────────────────── */
  .core-summary {
    height: 100%;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    padding: 12px 16px;
  }
  .core-metric {
    position: relative;
    min-width: 0;
    padding: 9px 12px 8px;
    border: 1px solid rgba(53, 224, 255, 0.10);
    background: linear-gradient(145deg, rgba(12, 55, 92, 0.24), rgba(3, 18, 35, 0.34));
    overflow: hidden;
  }
  .core-metric::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 32px;
    height: 1px;
    background: var(--sc, var(--cyan));
    box-shadow: 0 0 8px var(--sc, var(--cyan));
  }
  .core-metric .cm-label { font-size: 9px; color: var(--muted); letter-spacing: 0.04em; }
  .core-metric .cm-value {
    margin-top: 8px;
    display: flex;
    align-items: baseline;
    gap: 4px;
    font-family: var(--font-num);
    font-size: 27px;
    font-weight: 500;
    line-height: 1;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .core-metric .cm-value em { font-style: normal; font-size: 11px; color: var(--dim); }
  .core-metric .cm-value.crit { color: var(--red); }
  .core-metric .cm-value.warn { color: var(--yellow); }
  .core-metric .cm-sub { margin-top: 7px; display: flex; justify-content: space-between; gap: 6px; font-size: 8px; color: var(--dim); white-space: nowrap; }
  .core-metric .cm-sub b { color: var(--sc, var(--cyan)); font-weight: 400; }
  .spark-bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; margin-top: 4px; }
  .spark-bars i { width: 4px; background: var(--sc, var(--cyan)); opacity: 0.50; }
  .spark-bars i:nth-child(2n) { opacity: 0.75; }
  .spark-bars i:nth-child(3n) { opacity: 0.35; }

  .chain-wrap {
    position: relative;
    height: 248px;
    padding: 14px 14px 0;
    display: flex;
    align-items: center;
  }
  .chain-line {
    position: absolute;
    left: 26px;
    right: 26px;
    top: 50%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(53, 224, 255, 0.34) 8%, rgba(53, 224, 255, 0.34) 92%, transparent);
    z-index: 0;
  }
  .chain-line::after {
    content: "";
    position: absolute;
    top: -2px;
    left: 0;
    width: 46px;
    height: 5px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    animation: chainFlow 4s linear infinite;
    opacity: 0.8;
  }
  @keyframes chainFlow { from { left: 0; } to { left: calc(100% - 46px); } }
  .chain {
    position: relative;
    z-index: 1;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
    align-items: center;
  }
  .chain-step {
    position: relative;
    min-width: 0;
    height: 192px;
    padding: 12px 10px 10px;
    border: 1px solid rgba(53, 224, 255, 0.14);
    background: linear-gradient(155deg, rgba(12, 56, 96, 0.50), rgba(3, 18, 35, 0.68));
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    transition: border-color 0.2s, background 0.2s;
  }
  .chain-step.s-warn { border-color: rgba(255, 207, 63, 0.36); background: linear-gradient(155deg, rgba(82, 67, 20, 0.35), rgba(25, 20, 8, 0.58)); }
  .chain-step.s-crit { border-color: rgba(255, 92, 114, 0.48); background: linear-gradient(155deg, rgba(96, 28, 45, 0.38), rgba(32, 9, 18, 0.64)); }
  .chain-step::after {
    content: "›";
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(53, 224, 255, 0.28);
    font-family: var(--font-num);
    font-size: 14px;
    z-index: 2;
  }
  .chain-step:last-child::after { display: none; }
  .chain-top { display: flex; align-items: center; gap: 5px; }
  .chain-top i { width: 5px; height: 5px; border-radius: 50%; background: var(--sc, var(--green)); box-shadow: 0 0 7px var(--sc, var(--green)); }
  .chain-top span { font-family: var(--font-mono); font-size: 6.5px; letter-spacing: 0.12em; color: var(--dim); }
  .chain-step h3 { margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: 0.04em; white-space: nowrap; }
  .chain-step .chain-sub { margin-top: 3px; font-family: var(--font-mono); font-size: 6.5px; letter-spacing: 0.10em; color: rgba(115, 185, 220, 0.62); }
  .chain-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 12px; }
  .chain-metrics div { min-width: 0; }
  .chain-metrics em { display: block; font-style: normal; font-family: var(--font-mono); font-size: 6.5px; letter-spacing: 0.08em; color: var(--dim); }
  .chain-metrics b { display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-num); font-size: 15px; font-weight: 500; color: var(--text-soft); }
  .chain-step.s-warn .chain-metrics b { color: var(--yellow); }
  .chain-step.s-crit .chain-metrics b { color: var(--red); }
  .chain-bar { height: 2px; margin-top: 12px; background: rgba(255, 255, 255, 0.06); }
  .chain-bar i { display: block; height: 100%; background: var(--sc, var(--green)); opacity: 0.8; }
  .chain-state { display: block; margin-top: 8px; font-size: 8px; color: var(--sc, var(--green)); }
  .chain-foot {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 0 14px 12px;
  }
  .chain-foot div { display: flex; align-items: baseline; justify-content: space-between; padding: 7px 9px; border-top: 1px solid rgba(53, 224, 255, 0.08); }
  .chain-foot span { font-size: 8px; color: var(--dim); }
  .chain-foot b { font-family: var(--font-num); font-size: 12px; font-weight: 500; color: var(--cyan); }

  .funnel { padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 9px; }
  .funnel-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 82px; gap: 10px; align-items: center; }
  .funnel-row > span { font-size: 9px; color: var(--muted); }
  .funnel-track { height: 13px; background: rgba(255, 255, 255, 0.035); position: relative; overflow: hidden; }
  .funnel-track i { display: block; height: 100%; background: var(--sc, var(--cyan)); opacity: 0.72; }
  .funnel-track::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent); }
  .funnel-row b { text-align: right; font-family: var(--font-num); font-size: 11px; font-weight: 500; color: var(--text-soft); }
  .funnel-row b em { margin-left: 5px; font-style: normal; font-size: 8px; color: var(--dim); }
  .funnel-note { margin-top: auto; display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid rgba(53, 224, 255, 0.08); font-family: var(--font-mono); font-size: 7.5px; color: var(--dim); }
  .funnel-note b { color: var(--cyan); font-weight: 400; }
  .funnel-chart { margin-top: 8px; padding-top: 7px; border-top: 1px dashed rgba(53, 224, 255, 0.07); }
  .funnel-chart-head { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 6.5px; color: var(--dim); letter-spacing: 0.04em; }
  .funnel-chart-head b { color: var(--cyan); font-weight: 400; }
  .funnel-chart svg { display: block; width: 100%; height: 44px; margin-top: 3px; overflow: visible; }
  .funnel-chips { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .funnel-chips span { font-family: var(--font-mono); font-size: 6.5px; color: var(--dim); }
  .funnel-chips b { color: var(--text-soft); font-weight: 400; }
  .risk-owner { margin-top: 7px; padding: 8px 12px 0; border-top: 1px solid rgba(53, 224, 255, 0.08); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .risk-owner > div { padding: 6px 8px; background: rgba(9, 43, 74, 0.18); border: 1px solid rgba(53, 224, 255, 0.07); }
  .risk-owner span { display: block; font-family: var(--font-mono); font-size: 6.5px; letter-spacing: 0.08em; color: var(--dim); }
  .risk-owner b { display: block; margin-top: 3px; font-size: 10px; font-weight: 500; color: var(--text-soft); }
  .risk-owner em { display: block; margin-top: 2px; font-size: 7px; font-style: normal; color: var(--muted); }

  .risk-list { padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .risk-row { display: grid; grid-template-columns: 7px minmax(0, 1fr) auto; gap: 9px; align-items: start; padding: 10px 2px; border-bottom: 1px dashed rgba(53, 224, 255, 0.08); }
  .risk-row:last-child { border-bottom: 0; }
  .risk-row > i { width: 5px; height: 5px; margin-top: 4px; border-radius: 50%; background: var(--sc, var(--green)); box-shadow: 0 0 7px var(--sc, var(--green)); }
  .risk-row b { display: block; font-size: 10px; font-weight: 500; color: var(--text-soft); }
  .risk-row span { display: block; margin-top: 3px; font-size: 8px; color: var(--dim); }
  .risk-row em { font-family: var(--font-mono); font-size: 7.5px; font-style: normal; color: var(--muted); white-space: nowrap; }
  .risk-foot { margin-top: auto; padding: 9px 16px 10px; border-top: 1px solid rgba(53, 224, 255, 0.08); font-family: var(--font-mono); font-size: 7.5px; color: var(--dim); display: flex; justify-content: space-between; }
  .risk-foot b { color: var(--yellow); font-weight: 400; }

  /* ── B · 故障演练剧场 ─────────────────────── */
  .incident {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 18px;
  }
  .incident-badge {
    flex: 0 0 auto;
    min-width: 62px;
    height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid color-mix(in srgb, var(--sc, var(--green)) 42%, transparent);
    background: color-mix(in srgb, var(--sc, var(--green)) 8%, transparent);
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  }
  .incident-badge b { font-family: var(--font-num); font-size: 22px; font-weight: 500; line-height: 1; color: var(--sc, var(--green)); }
  .incident-badge span { margin-top: 4px; font-family: var(--font-mono); font-size: 6.5px; letter-spacing: 0.10em; color: var(--dim); }
  .incident-main { min-width: 0; }
  .incident-main h3 { font-size: 17px; font-weight: 500; letter-spacing: 0.04em; color: var(--text); }
  .incident-main p { margin-top: 5px; font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .incident-stats { margin-left: auto; display: flex; gap: 20px; }
  .incident-stat { min-width: 64px; text-align: right; }
  .incident-stat span { display: block; font-family: var(--font-mono); font-size: 6.5px; letter-spacing: 0.10em; color: var(--dim); }
  .incident-stat b { display: block; margin-top: 4px; font-family: var(--font-num); font-size: 17px; font-weight: 500; color: var(--text); }
  .incident-stat b.crit { color: var(--red); }
  .incident-stat b.warn { color: var(--yellow); }

  .impact-layout { display: grid; grid-template-columns: minmax(0, 1fr) 292px; height: 100%; }
  .impact-map { position: relative; min-height: 0; margin: 6px 8px 4px 12px; }
  .impact-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .impact-ring { fill: none; stroke: rgba(53, 224, 255, 0.10); stroke-width: 1; }
  .impact-ring.r2 { stroke-dasharray: 3 7; }
  .impact-link { stroke: rgba(53, 224, 255, 0.34); stroke-width: 1; fill: none; }
  .impact-link.warn { stroke: rgba(255, 207, 63, 0.58); stroke-dasharray: 4 6; }
  .impact-link.crit { stroke: rgba(255, 92, 114, 0.72); stroke-dasharray: 4 6; }
  .impact-node {
    position: absolute;
    width: 118px;
    min-height: 53px;
    padding: 7px 9px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(53, 224, 255, 0.16);
    background: rgba(4, 24, 44, 0.86);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    z-index: 2;
  }
  .impact-node.core {
    width: 152px;
    min-height: 72px;
    border-color: color-mix(in srgb, var(--sc, var(--green)) 45%, transparent);
    background: color-mix(in srgb, var(--sc, var(--green)) 7%, rgba(4, 24, 44, 0.92));
    padding: 10px 12px;
  }
  .impact-node.core::before,
  .impact-node.core::after {
    content: "";
    position: absolute;
    inset: -15px;
    border: 1px solid color-mix(in srgb, var(--sc, var(--green)) 18%, transparent);
    border-radius: 50%;
    pointer-events: none;
  }
  .impact-node.core::after { inset: -28px; opacity: 0.45; }
  .impact-node .in-head { display: flex; align-items: center; gap: 5px; }
  .impact-node .in-head i { width: 5px; height: 5px; border-radius: 50%; background: var(--sc, var(--green)); box-shadow: 0 0 7px var(--sc, var(--green)); }
  .impact-node .in-head b { font-size: 10px; font-weight: 500; color: var(--text-soft); white-space: nowrap; }
  .impact-node.core .in-head b { font-size: 13px; color: var(--text); }
  .impact-node .in-meta { margin-top: 5px; font-family: var(--font-mono); font-size: 7px; letter-spacing: 0.02em; color: var(--dim); white-space: nowrap; }
  .impact-node.core .in-meta { font-size: 7.5px; color: var(--muted); }
  .impact-node.status-warn { border-color: rgba(255, 207, 63, 0.42); }
  .impact-node.status-crit { border-color: rgba(255, 92, 114, 0.58); }
  .pos-portal { left: 17%; top: 20%; }
  .pos-ticket { left: 17%; top: 80%; }
  .pos-knowledge { left: 83%; top: 20%; }
  .pos-report { left: 83%; top: 80%; }
  .pos-cmdb { left: 50%; top: 10%; }
  .pos-auto { left: 50%; top: 90%; }
  .pos-desk { left: 8%; top: 50%; }
  .pos-monitor { left: 92%; top: 50%; }
  .pos-core { left: 50%; top: 50%; }

  .impact-stat {
    position: absolute;
    z-index: 3;
    min-width: 82px;
    padding: 6px 8px;
    border: 1px solid rgba(53, 224, 255, 0.12);
    background: rgba(3, 18, 35, 0.74);
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .impact-stat span { display: block; font-family: var(--font-mono); font-size: 6px; letter-spacing: 0.08em; color: var(--dim); }
  .impact-stat b { display: block; margin-top: 2px; font-family: var(--font-num); font-size: 13px; font-weight: 500; color: var(--text-soft); }
  .impact-stat b.crit { color: var(--red); }
  .impact-stat b.warn { color: var(--yellow); }
  .stat-tl { left: 35%; top: 30%; }
  .stat-tr { left: 65%; top: 30%; }
  .stat-bl { left: 35%; top: 70%; }
  .stat-br { left: 65%; top: 70%; }

  .impact-side { border-left: 1px solid rgba(53, 224, 255, 0.09); padding: 8px 12px 6px; display: flex; flex-direction: column; min-height: 0; }
  .impact-side-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px 7px; border-bottom: 1px solid rgba(53, 224, 255, 0.10); }
  .impact-side-head b { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; color: var(--text-soft); }
  .impact-side-head span { font-family: var(--font-num); font-size: 15px; color: var(--sc, var(--cyan)); }
  .impact-rows { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .impact-row { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 7px; align-items: center; padding: 9px 2px; border-bottom: 1px dashed rgba(53, 224, 255, 0.07); }
  .impact-row:last-child { border-bottom: 0; }
  .impact-row i { width: 5px; height: 5px; border-radius: 50%; background: var(--sc, var(--green)); }
  .impact-row b { display: block; font-size: 9.5px; font-weight: 500; color: var(--text-soft); }
  .impact-row span { display: block; margin-top: 2px; font-size: 7.5px; color: var(--dim); }
  .impact-row em { font-family: var(--font-mono); font-size: 7px; font-style: normal; color: var(--muted); white-space: nowrap; }
  .impact-side-foot { padding-top: 7px; border-top: 1px solid rgba(53, 224, 255, 0.09); font-family: var(--font-mono); font-size: 7px; color: var(--dim); display: flex; justify-content: space-between; }
  .impact-side-foot b { color: var(--sc, var(--green)); font-weight: 400; }

  .timeline { padding: 14px 18px 8px; display: flex; flex-direction: column; gap: 0; height: 100%; }
  .timeline-track { position: relative; display: flex; gap: 0; padding-top: 4px; }
  .timeline-track::before { content: ""; position: absolute; left: 5%; right: 5%; top: 18px; height: 1px; background: rgba(53, 224, 255, 0.13); }
  .timeline-track::after { content: ""; position: absolute; left: 5%; top: 18px; height: 1px; width: var(--tw, 0%); background: var(--sc, var(--cyan)); opacity: 0.7; transition: width 0.4s; }
  .tl-step { position: relative; flex: 1; padding: 26px 6px 0; }
  .tl-step::before { content: ""; position: absolute; left: 5%; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: #041526; border: 1px solid rgba(53, 224, 255, 0.25); z-index: 1; }
  .tl-step.done::before { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .tl-step.active::before { background: var(--sc, var(--yellow)); border-color: var(--sc, var(--yellow)); box-shadow: 0 0 9px var(--sc, var(--yellow)); }
  .tl-step b { display: block; font-size: 9px; font-weight: 500; color: var(--text-soft); }
  .tl-step span { display: block; margin-top: 3px; font-family: var(--font-mono); font-size: 7px; color: var(--dim); }
  .timeline-note { margin-top: auto; padding-top: 8px; border-top: 1px solid rgba(53, 224, 255, 0.08); font-size: 8px; color: var(--muted); }
  .timeline-note b { color: var(--yellow); font-weight: 400; }

  .vtimeline { height: 100%; padding: 4px 16px 8px; display: flex; flex-direction: column; }
  .vt-step { position: relative; display: grid; grid-template-columns: 15px minmax(0, 1fr) auto; gap: 8px; padding: 10px 0 10px 4px; border-bottom: 1px dashed rgba(53, 224, 255, 0.07); }
  .vt-step:last-child { border-bottom: 0; }
  .vt-step::before { content: ""; position: absolute; left: 10px; top: 24px; bottom: -11px; width: 1px; background: rgba(53, 224, 255, 0.10); }
  .vt-step:last-child::before { display: none; }
  .vt-step > i { width: 8px; height: 8px; margin-top: 3px; border-radius: 50%; border: 1px solid rgba(53, 224, 255, 0.24); background: #041526; z-index: 1; }
  .vt-step.done > i { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .vt-step.active > i { background: var(--sc, var(--yellow)); border-color: var(--sc, var(--yellow)); box-shadow: 0 0 9px var(--sc, var(--yellow)); }
  .vt-step b { display: block; font-size: 9.5px; font-weight: 500; color: var(--text-soft); }
  .vt-step span { display: block; margin-top: 3px; font-size: 7.5px; color: var(--dim); }
  .vt-step em { font-family: var(--font-mono); font-size: 7px; font-style: normal; color: var(--muted); }
  .vt-foot { margin-top: auto; padding-top: 7px; border-top: 1px solid rgba(53, 224, 255, 0.08); display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 7px; color: var(--dim); }
  .vt-foot b { color: var(--sc, var(--green)); font-weight: 400; }

  .impact-metrics { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; height: 100%; }
  .impact-metric { padding: 10px 11px; border: 1px solid rgba(53, 224, 255, 0.10); background: rgba(9, 43, 74, 0.20); }
  .impact-metric span { display: block; font-size: 8px; color: var(--dim); }
  .impact-metric b { display: block; margin-top: 6px; font-family: var(--font-num); font-size: 21px; font-weight: 500; color: var(--text); }
  .impact-metric b em { margin-left: 3px; font-style: normal; font-size: 8px; color: var(--dim); }
  .impact-metric b.crit { color: var(--red); }
  .impact-metric b.warn { color: var(--yellow); }
  .impact-metric small { display: block; margin-top: 4px; font-size: 7.5px; color: var(--dim); }

  /* ── C · 数字孪生 ─────────────────────────── */
  .twin-summary { height: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px 16px; }
  .twin-kpi { padding: 6px 11px; border-left: 1px solid rgba(53, 224, 255, 0.12); }
  .twin-kpi:first-child { border-left: 0; padding-left: 0; }
  .twin-kpi span { display: block; font-size: 8px; color: var(--dim); }
  .twin-kpi b { display: block; margin-top: 4px; font-family: var(--font-num); font-size: 20px; font-weight: 500; color: var(--text); }
  .twin-kpi b em { margin-left: 3px; font-style: normal; font-size: 8px; color: var(--dim); }
  .twin-kpi small { display: block; margin-top: 2px; font-family: var(--font-mono); font-size: 6.5px; letter-spacing: 0.04em; color: var(--dim); }

  .twin-stage {
    position: relative;
    height: 100%;
    padding: 8px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: center;
    background:
      linear-gradient(90deg, transparent 0, rgba(53, 224, 255, 0.035) 50%, transparent 100%),
      repeating-linear-gradient(0deg, transparent 0 27px, rgba(53, 224, 255, 0.025) 27px 28px);
  }
  .twin-stage::before {
    content: "";
    position: absolute;
    left: 18%;
    right: 18%;
    top: 4%;
    bottom: 4%;
    background: linear-gradient(90deg, transparent, rgba(53, 224, 255, 0.05), transparent);
    filter: blur(18px);
    pointer-events: none;
  }
  .twin-layer {
    position: relative;
    height: 84px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    background: linear-gradient(145deg, rgba(13, 58, 98, 0.42), rgba(3, 18, 35, 0.72));
    border: 1px solid rgba(53, 224, 255, 0.14);
    clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
    z-index: 1;
  }
  .twin-layer.l1 { width: 82%; border-color: rgba(53, 224, 255, 0.18); }
  .twin-layer.l2 { width: 88%; border-color: rgba(53, 224, 255, 0.16); }
  .twin-layer.l3 { width: 94%; border-color: rgba(53, 224, 255, 0.14); }
  .twin-layer.l4 { width: 100%; border-color: rgba(53, 224, 255, 0.10); }
  .twin-layer::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 80px;
    height: 1px;
    background: var(--cyan);
    opacity: 0.45;
    box-shadow: 0 0 8px var(--cyan);
  }
  .twin-layer-label { flex: 0 0 92px; }
  .twin-layer-label b { display: block; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-soft); }
  .twin-layer-label span { display: block; margin-top: 3px; font-family: var(--font-mono); font-size: 6.5px; letter-spacing: 0.12em; color: var(--dim); }
  .twin-items { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .twin-chip {
    min-width: 0;
    height: 54px;
    padding: 7px 9px;
    border: 1px solid rgba(53, 224, 255, 0.10);
    background: rgba(3, 18, 35, 0.48);
  }
  .twin-chip .tw-top { display: flex; align-items: center; gap: 5px; }
  .twin-chip .tw-top i { width: 4px; height: 4px; border-radius: 50%; background: var(--sc, var(--green)); box-shadow: 0 0 6px var(--sc, var(--green)); }
  .twin-chip .tw-top b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; font-weight: 500; color: var(--text-soft); }
  .twin-chip .tw-meta { margin-top: 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 4px; font-family: var(--font-mono); font-size: 6.5px; color: var(--dim); }
  .twin-chip .tw-meta em { font-style: normal; color: var(--text-soft); }
  .twin-chip .tw-meter { margin-top: 5px; height: 2px; background: rgba(255, 255, 255, 0.07); }
  .twin-chip .tw-meter i { display: block; height: 100%; background: var(--sc, var(--cyan)); }
  .twin-chip.s-warn { border-color: rgba(255, 207, 63, 0.30); }
  .twin-chip.s-crit { border-color: rgba(255, 92, 114, 0.45); }
  .twin-chip.s-crit .tw-top b { color: var(--red); }
  .twin-chip.s-warn .tw-top b { color: var(--yellow); }

  .twin-bottom-panel { padding: 10px 14px; height: 100%; display: flex; flex-direction: column; }
  .capacity-row { display: grid; grid-template-columns: 48px 1fr 40px; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px dashed rgba(53, 224, 255, 0.07); }
  .capacity-row:last-child { border-bottom: 0; }
  .capacity-row span { font-size: 8px; color: var(--muted); }
  .capacity-row b { font-family: var(--font-num); font-size: 10px; font-weight: 500; color: var(--text-soft); text-align: right; }
  .capacity-bar { height: 4px; background: rgba(255, 255, 255, 0.06); }
  .capacity-bar i { display: block; height: 100%; background: var(--sc, var(--cyan)); }
  .twin-risk { display: flex; flex-direction: column; gap: 0; }
  .twin-risk-row { display: grid; grid-template-columns: 6px 1fr auto; gap: 7px; align-items: center; padding: 8px 0; border-bottom: 1px dashed rgba(53, 224, 255, 0.07); }
  .twin-risk-row:last-child { border-bottom: 0; }
  .twin-risk-row i { width: 4px; height: 4px; border-radius: 50%; background: var(--sc, var(--green)); }
  .twin-risk-row b { font-size: 9px; font-weight: 400; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .twin-risk-row em { font-family: var(--font-mono); font-size: 6.5px; font-style: normal; color: var(--muted); }
  .capacity-foot { margin-top: auto; padding-top: 7px; border-top: 1px solid rgba(53, 224, 255, 0.08); display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 6.5px; color: var(--dim); }
  .capacity-foot b { color: var(--yellow); font-weight: 400; }
  .twin-events { margin-top: 4px; padding-top: 5px; border-top: 1px dashed rgba(53, 224, 255, 0.07); }
  .twin-event { display: flex; justify-content: space-between; gap: 6px; padding: 4px 0; font-size: 7px; color: var(--muted); }
  .twin-event span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .twin-event em { font-family: var(--font-mono); font-style: normal; color: var(--dim); white-space: nowrap; }
  .dep-bar { margin-top: 5px; height: 2px; background: rgba(255, 255, 255, 0.06); }
  .dep-bar i { display: block; height: 100%; background: var(--sc, var(--green)); }

  /* ── 外层方案切换 ─────────────────────────── */
  .proto-switch {
    position: fixed;
    left: 50%;
    bottom: 3px;
    z-index: 50;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 6px;
    border: 1px solid rgba(53, 224, 255, 0.28);
    background: rgba(3, 19, 34, 0.95);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    box-shadow: 0 0 18px rgba(0, 0, 0, 0.58);
  }
  .proto-switch > span { padding: 0 6px; font-family: var(--font-mono); font-size: 7.5px; color: var(--dim); white-space: nowrap; }
  .proto-switch .compare-tab {
    height: 25px;
    padding: 0 9px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-cn);
    font-size: 9px;
    white-space: nowrap;
    cursor: pointer;
  }
  .proto-switch .compare-tab b { color: var(--cyan); margin-right: 4px; font-family: var(--font-num); font-weight: 500; }
  .proto-switch .compare-tab:hover { color: var(--text-soft); }
  .proto-switch .compare-tab.active { color: var(--text); border-color: rgba(53, 224, 255, 0.40); background: rgba(53, 224, 255, 0.10); }
  .proto-switch .compare-note { padding: 0 5px; font-size: 7.5px; color: var(--dim); white-space: nowrap; }

  .proto-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid rgba(53, 224, 255, 0.25);
    background: rgba(3, 19, 34, 0.92);
    text-align: center;
  }
  .proto-fallback b { font-size: 14px; color: var(--text); font-weight: 500; }
  .proto-fallback span { max-width: 560px; font-size: 10px; line-height: 1.7; color: var(--muted); }
  .proto-fallback code { font-family: var(--font-mono); color: var(--cyan); }

  html.still .proto-panel { animation: none; }
  html.still .chain-line::after { animation: none; }
  html.still .demo-progress i { transition: none; }
</style>
</head>
<body>
<div class="proto-viewport">
  <div class="proto-stage-wrap">
    <div class="proto-stage" id="protoStage">
      <iframe id="cockpitFrame" src="../index.html?still=1" title="驾驶舱底图" tabindex="-1" aria-hidden="true"></iframe>
      <div class="proto-center" id="protoCenter"></div>
    </div>
  </div>

  <div class="proto-switch" role="group" aria-label="中间列方案切换">
    <span>对比方案</span>
    <button class="compare-tab active" type="button" data-variant="a"><b>A</b>业务运行态</button>
    <button class="compare-tab" type="button" data-variant="b"><b>B</b>故障演练</button>
    <button class="compare-tab" type="button" data-variant="c"><b>C</b>数字孪生</button>
    <span class="compare-note">自动 10s · 点状态即暂停</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  const frame = document.getElementById('cockpitFrame');
  const stage = document.getElementById('protoStage');
  const center = document.getElementById('protoCenter');
  const tabs = Array.prototype.slice.call(document.querySelectorAll('.compare-tab'));
  const params = new URLSearchParams(location.search);
  const STILL = params.get('still') === '1';
  if (STILL) document.documentElement.classList.add('still');

  const STATES = [
    {
      id: 'normal', label: '正常', tone: 'ok',
      health: '99.97', requests: '18.6万', success: '99.97', risk: '0', p95: '38ms',
      platform: '运行正常', platformLat: '42ms', ticketLat: '38ms', reportLat: '36ms',
      elapsed: '—', sla: '—', recovery: 0, impacted: 0, degraded: 0, failed: 0,
      step: 0, title: '核心业务运行正常', note: '当前无 P1 / P2 · 最近一次演练已完成'
    },
    {
      id: 'alert', label: 'P2 告警', tone: 'crit',
      health: '99.72', requests: '18.6万', success: '99.72', risk: '1', p95: '96ms',
      platform: 'P2 故障', platformLat: '1.2s', ticketLat: '96ms', reportLat: '820ms',
      elapsed: '12:34', sla: '18:00', recovery: 0, impacted: 2, degraded: 2, failed: 1,
      step: 1, title: '数据中台 P2 故障', note: '影响工单中心 / 报表服务 · 已定位连接池耗尽'
    },
    {
      id: 'handling', label: '处置中', tone: 'warn',
      health: '99.85', requests: '18.6万', success: '99.85', risk: '1', p95: '72ms',
      platform: '降级中', platformLat: '320ms', ticketLat: '72ms', reportLat: '480ms',
      elapsed: '18:42', sla: '11:52', recovery: 60, impacted: 2, degraded: 2, failed: 0,
      step: 2, title: '数据中台降级运行', note: '已切只读 / 报表任务排队 · 预计 8 分钟恢复'
    },
    {
      id: 'recovered', label: '已恢复', tone: 'ok',
      health: '99.97', requests: '18.6万', success: '99.97', risk: '0', p95: '38ms',
      platform: '已恢复', platformLat: '42ms', ticketLat: '38ms', reportLat: '36ms',
      elapsed: '21:08', sla: '—', recovery: 100, impacted: 0, degraded: 0, failed: 0,
      step: 4, title: '数据中台已恢复', note: '恢复验证通过 / 事件已关闭 · 复盘待提交'
    }
  ];

  let variant = 'a';
  let stateIndex = 1;
  let playing = !STILL;
  let progress = 0;
  let timer = null;

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function s() { return STATES[stateIndex]; }

  function fitStage() {
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }

  function demoControls() {
    const state = s();
    return '<div class="demo-controls">' +
      '<span class="demo-mode"><i class="' + (playing ? '' : 'paused') + '"></i>' + (playing ? '自动演示' : '已暂停') + '<em>' + (playing ? '10s' : '手动') + '</em></span>' +
      '<span class="demo-progress"><i style="width:' + (progress * 10) + '%"></i></span>' +
      '<button class="demo-btn" type="button" data-demo="prev" aria-label="上一步">‹</button>' +
      '<button class="demo-btn" type="button" data-demo="play">' + (playing ? '暂停' : '播放') + '</button>' +
      '<button class="demo-btn" type="button" data-demo="next" aria-label="下一步">›</button>' +
      '<span class="demo-states">' + STATES.map(function (st, i) {
        return '<button class="demo-state' + (i === stateIndex ? ' active' : '') + '" type="button" data-demo-state="' + i + '" data-tone="' + st.tone + '">' +
          '<i></i>' + esc(st.label) + '</button>';
      }).join('') + '</span>' +
    '</div>';
  }

  function head(idx, title, en, right) {
    return '<div class="panel-head">' +
      '<div class="ph-left"><i class="ph-idx">' + idx + '</i><h2>' + title + '</h2><span class="ph-en">' + en + '</span></div>' +
      (right || '<span class="head-tag">LIVE</span>') +
    '</div>';
  }

  function panel(idx, title, en, body, right, cls) {
    return '<section class="panel proto-panel ' + (cls || '') + '">' +
      head(idx, title, en, right) +
      '<div class="panel-body">' + body + '</div>' +
    '</section>';
  }

  /* ── A · 核心业务运行态 ───────────────────── */
  function summaryMetric(label, value, unit, sub, tone, bars) {
    return '<div class="core-metric s-' + tone + '">' +
      '<div class="cm-label">' + label + '</div>' +
      '<div class="cm-value ' + (tone === 'crit' ? 'crit' : tone === 'warn' ? 'warn' : '') + '">' + value + (unit ? '<em>' + unit + '</em>' : '') + '</div>' +
      '<div class="cm-sub">' + sub + '</div>' +
      '<div class="spark-bars">' + bars.map(function (h) { return '<i style="height:' + h + 'px"></i>'; }).join('') + '</div>' +
    '</div>';
  }

  function renderA() {
    const st = s();
    const dataTone = st.id === 'alert' ? 'crit' : st.id === 'handling' ? 'warn' : 'ok';
    const ticketTone = (st.id === 'alert' || st.id === 'handling') ? 'warn' : 'ok';
    const stages = [
      { key: 'channel', name: '渠道入口', en: 'CHANNEL', qps: '18.6k', lat: '32ms', tone: 'ok', status: '正常' },
      { key: 'gateway', name: 'API 网关', en: 'GATEWAY', qps: '12.4k', lat: '8ms', tone: 'ok', status: '正常' },
      { key: 'portal', name: '统一门户', en: 'CORE PORTAL', qps: '8.6k', lat: '12ms', tone: 'ok', status: '正常' },
      { key: 'ticket', name: '工单中心', en: 'TICKET HUB', qps: '1.8k', lat: st.ticketLat, tone: ticketTone, status: ticketTone === 'warn' ? '降级' : '正常' },
      { key: 'data', name: '数据中台', en: 'DATA PLATFORM', qps: '3.2k', lat: st.platformLat, tone: dataTone, status: st.platform },
      { key: 'cmdb', name: 'CMDB', en: 'CONFIG BASE', qps: '860', lat: '18ms', tone: 'ok', status: '正常' }
    ];

    const total = 186420;
    const failed = st.failed;
    const degraded = st.degraded;
    const success = total - failed - degraded;
    const successPct = success / total * 100;
    const funnelRows = [
      { label: '请求', value: total, pct: 100, tone: 'cyan' },
      { label: '成功', value: success, pct: successPct, tone: 'ok' },
      { label: '降级', value: degraded, pct: degraded / total * 100, tone: 'warn' },
      { label: '失败', value: failed, pct: failed / total * 100, tone: 'crit' }
    ];

    const activeRisk = st.id === 'alert' || st.id === 'handling';
    const risks = activeRisk ? [
      { tone: 'crit', title: '数据中台 P2', desc: '连接池耗尽 · 已降级只读', meta: 'P2 · 陈子昂' },
      { tone: 'warn', title: '工单中心延迟', desc: 'P95 96ms · 自动降级生效', meta: '关联 · 数据中台' },
      { tone: 'warn', title: '报表任务排队', desc: '批处理延迟 4 分钟', meta: '队列 · 18 个' }
    ] : [
      { tone: 'ok', title: '当前无活跃 P2', desc: '核心链路全部正常', meta: '已稳定 46 天' },
      { tone: 'warn', title: '下一变更 22:00', desc: '核心数据库主备切换', meta: 'DB-CORE-03' },
      { tone: 'warn', title: '容量预警 存储 74.1%', desc: '预计 21 天达到 80%', meta: '容量组' }
    ];

    const body = '<div class="proto-view proto-a-layout">' +

    if (st.id === 'normal') {

        badge: 'OK', badgeSub: 'ALL CLEAR', title: st.title, note: st.note,
        metrics: [['今日事件', '2 起', ''], ['平均响应', '2m 48s', ''], ['值班在岗', '5 人', '']]
      };
    }
    if (st.id === 'recovered') {
      return {
        badge: 'OK', badgeSub: 'RECOVERED', title: st.title, note: st.note,
        metrics: [['总耗时', st.elapsed, ''], ['影响业务', '0', ''], ['复盘', '待提交', 'warn']]
      };
    }
    return {
      badge: 'P2', badgeSub: 'INCIDENT', title: st.title, note: st.note,
      metrics: [['持续时间', st.elapsed, 'crit'], ['影响业务', st.impacted + ' 个', 'crit'], ['SLA 剩余', st.sla, 'warn']]
    };
  }

        panel(8, '关键依赖', 'DEPENDENCY',
          '<div class="twin-bottom-panel twin-risk">' +
            '<div class="twin-risk-row s-ok"><i></i><b>门户 → API 网关</b><em>8ms</em></div>' +
            '<div class="twin-risk-row ' + (active ? 's-warn' : 's-ok') + '"><i></i><b>门户 → 数据中台</b><em>' + st.platformLat + '</em></div>' +
            '<div class="twin-risk-row s-ok"><i></i><b>数据中台 → CMDB</b><em>36ms</em></div>' +
            '<div class="twin-risk-row ' + (active ? 's-warn' : 's-ok') + '"><i></i><b>工单 → 数据中台</b><em>' + st.ticketLat + '</em></div>' +
            '<div class="twin-risk-row s-ok"><i></i><b>自动化 → CMDB</b><em>18ms</em></div>' +
          '</div>',
          '<span class="head-tag">5 LINKS</span>'
        ) +
      '</div>' +
    '</div>';

    center.innerHTML = body;
    updateProgressUI();
  }

  function render() {
    if (variant === 'b') renderB();
    else if (variant === 'c') renderC();
    else renderA();
  }

  function updateProgressUI() {
    const bar = center.querySelector('.demo-progress i');
    if (bar) bar.style.width = (progress * 10) + '%';
  }

  function updateDemoUI() {
    const mode = center.querySelector('.demo-mode');
    if (mode) {
      mode.innerHTML = '<i class="' + (playing ? '' : 'paused') + '"></i>' + (playing ? '自动演示' : '已暂停') + '<em>' + (playing ? '10s' : '手动') + '</em>';
    }
    const play = center.querySelector('[data-demo="play"]');
    if (play) play.textContent = playing ? '暂停' : '播放';
    Array.prototype.forEach.call(center.querySelectorAll('[data-demo-state]'), function (button) {
      button.classList.toggle('active', Number(button.getAttribute('data-demo-state')) === stateIndex);
    });
    updateProgressUI();
  }

  function setState(index, manual) {
    stateIndex = (index + STATES.length) % STATES.length;
    progress = 0;
    if (manual) playing = false;
    render();
  }

  function togglePlay() {
    playing = !playing;
    if (playing && progress >= 10) progress = 0;
    render();
  }

  function nextState(step, manual) {
    setState(stateIndex + step, manual);
  }

  function setVariant(next) {
    variant = next;
    tabs.forEach(function (tab) {
      tab.classList.toggle('active', tab.getAttribute('data-variant') === next);
    });
    history.replaceState(null, '', '#' + next);
    render();
  }

  /* ── 事件绑定 ─────────────────────────────── */
  center.addEventListener('click', function (e) {
    const stateBtn = e.target.closest('[data-demo-state]');
    if (stateBtn) {
      setState(Number(stateBtn.getAttribute('data-demo-state')), true);
      return;
    }
    const demoBtn = e.target.closest('[data-demo]');
    if (!demoBtn) return;
    const action = demoBtn.getAttribute('data-demo');
    if (action === 'play') togglePlay();
    if (action === 'prev') nextState(-1, true);
    if (action === 'next') nextState(1, true);
  });

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      setVariant(tab.getAttribute('data-variant'));
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === '1') setVariant('a');
    if (e.key === '2') setVariant('b');
    if (e.key === '3') setVariant('c');
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowLeft') nextState(-1, true);
    if (e.key === 'ArrowRight') nextState(1, true);
  });

  window.addEventListener('resize', fitStage);
  fitStage();

  /* 自动轮播 */
  timer = setInterval(function () {
    if (!playing) return;
    progress += 0.1;
    if (progress >= 10) {
      progress = 0;
      stateIndex = (stateIndex + 1) % STATES.length;
      render();
    } else {
      updateProgressUI();
    }
  }, 100);

  /* 隐藏原始中间列，保留左右列与底图 */
  function init() {
    try {
      const doc = frame.contentDocument;
      const col = doc && doc.querySelector('.col-center');
      if (col) col.style.visibility = 'hidden';
      const initial = (location.hash || '').replace('#', '');
      if (initial === 'b' || initial === 'c') setVariant(initial);
      else render();
    } catch (e) {
      center.innerHTML = '<div class="proto-fallback"><b>无法读取驾驶舱底图</b><span>请通过本地静态服务打开，例如在项目根目录运行 <code>python -m http.server 4173</code>，再访问 <code>/prototypes/center-full-options.html</code>。</span></div>';
    }
  }

  if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
    setTimeout(init, 160);
  } else {
    frame.addEventListener('load', function () { setTimeout(init, 160); });
  }
})();
</script>
</body>
</html>
